[workspace]
resolver = "2"
members = [
    "crates/pnx-core",
    "crates/pnx-probe",
    "crates/pnx-dap",
]

[workspace.package]
version = "0.2.7"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
crossbeam-channel = "0.5"
gimli = "0.31"
object = { version = "0.36", features = ["read", "elf"] }
probe-rs = "=0.31.0"
probe-rs-debug = "=0.31.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
svd-parser = { version = "0.14.10", features = ["expand"] }
thiserror = "2"

[patch.crates-io]
probe-rs = { path = "vendor/probe-rs" }
