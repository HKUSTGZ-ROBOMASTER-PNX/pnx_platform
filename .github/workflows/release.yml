name: Build and publish release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (for example v1.1.3)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            asset: windows-x64
          - runner: ubuntu-22.04
            asset: linux-x64
          - runner: macos-15-intel
            asset: macOS-x64
          - runner: macos-14
            asset: macOS-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set application and Rust versions from release tag
        run: node scripts/release-version.mjs
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libudev-dev libusb-1.0-0-dev libgtk-3-0 libnss3 libasound2 libgbm1 xvfb cmake ninja-build
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja pkg-config
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        id: msys2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
      - name: Configure Windows Rust and linker
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup default stable-x86_64-pc-windows-gnu
          if ($LASTEXITCODE -ne 0) { throw 'Rust selection failed' }
          '${{ steps.msys2.outputs.msys2-location }}\mingw64\bin' | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          'PNX_NATIVE_TARGET=x86_64-pc-windows-gnu' | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure Unix Rust
        if: runner.os != 'Windows'
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build Windows backend
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-native-win.ps1
      - name: Build Unix backend
        if: runner.os != 'Windows'
        run: node scripts/build-native.mjs
      - name: Run unit and integration tests
        run: npm test
      - name: Download verified Windows Electron runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).devDependencies.electron
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Electron must be pinned' }
          $name = "electron-v$version-win32-x64.zip"
          $cache = Join-Path $env:LOCALAPPDATA 'electron\Cache'
          New-Item -ItemType Directory -Force $cache | Out-Null
          $url = "https://github.com/electron/electron/releases/download/v$version"
          Invoke-WebRequest "$url/$name" -OutFile (Join-Path $cache $name)
          $checksumFile = Join-Path $cache "SHASUMS256-$version.txt"
          Invoke-WebRequest "$url/SHASUMS256.txt" -OutFile $checksumFile
          ./scripts/verify-electron-checksum.ps1 -Archive (Join-Path $cache $name) -ChecksumFile $checksumFile
          "ELECTRON_VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-electron-win.ps1 -ElectronVersion $env:ELECTRON_VERSION -OutputName 'PnX-Platform-electron-win32-x64'
      - name: Test and archive Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node scripts/electron-ui-smoke.mjs dist/PnX-Platform-electron-win32-x64/PnX-Platform.exe
          if ($LASTEXITCODE -ne 0) { throw 'Packaged UI smoke test failed' }
          ./scripts/package-release-win.ps1 -PackageDir dist/PnX-Platform-electron-win32-x64
          Get-ChildItem dist/release -File | Where-Object Extension -in '.exe','.zip' | ForEach-Object {
            "$( (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() )  $($_.Name)"
          } | Set-Content dist/release/SHA256SUMS-windows-x64.txt -Encoding ascii
      - name: Package Unix application
        if: runner.os != 'Windows'
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run package:electron:host
      - name: Test and archive Linux application
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/release-host.mjs
      - name: Test and archive macOS application
        if: runner.os == 'macOS'
        run: node scripts/release-host.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-${{ matrix.asset }}
          include-hidden-files: true
          path: |
            .cache/**/desktop.log
            .cache/electron-ui-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: pnx-platform-${{ matrix.asset }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pnx-platform-*
          merge-multiple: true
          path: artifacts
      - name: Create or update release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/* --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/* --title "PnX Platform $RELEASE_TAG" --generate-notes --verify-tag
          fi
          gh release view "$RELEASE_TAG" --json url,assets
